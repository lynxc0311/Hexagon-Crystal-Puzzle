name: Android APK
on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check puzzle logic
        run: node tests/puzzle.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and lint installable APK
        run: gradle -p android --no-daemon assembleDebug lintDebug
      - name: Verify APK signature and bundled assets
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/debug/app-debug.apk
          python3 android/check_apk.py android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk Hexagon-Crystal-Puzzle-2.0.0-android.1.apk
          sha256sum Hexagon-Crystal-Puzzle-2.0.0-android.1.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Hexagon-Crystal-Puzzle-APK
          path: |
            Hexagon-Crystal-Puzzle-2.0.0-android.1.apk
            SHA256SUMS.txt
          retention-days: 30
      - name: Keep lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-lint-report
          path: android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
